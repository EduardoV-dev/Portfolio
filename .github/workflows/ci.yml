name: CI

on:
  pull_request:
    branches:
      - main
      - development

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter apps-frontend lint

      - name: Typecheck
        run: pnpm --filter apps-frontend typecheck

      - name: Format
        run: pnpm --filter apps-frontend exec prettier . --check

      - name: Build
        run: pnpm --filter apps-frontend build
