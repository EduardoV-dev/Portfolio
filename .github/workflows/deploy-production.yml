name: Deploy Production to Cloudflare

on:
    push:
        branches:
            - main
        paths:
            - "apps/web/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - ".github/workflows/deploy-production.yml"

    pull_request:
        branches:
            - main
        paths:
            - "apps/web/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - ".github/workflows/deploy-production.yml"

    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: true

jobs:
    deploy-production:
        name: Deploy Production
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: production
        env:
            CLOUDFLARE_ENV: production
            STRAPI_CMS_OPTIONAL: false
            PUBLIC_SENTRY_ENABLED: true
            PUBLIC_ENVIRONMENT: production
            PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
            PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG: ${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
            PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}
            PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
            STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
            STRAPI_API_URL: ${{ vars.STRAPI_API_URL }}

        defaults:
            run:
                working-directory: apps/web

        steps:
            - name: Wake up Strapi
              run: |
                  STRAPI_PING_URL="${STRAPI_API_URL%/}/ping"
                  curl --fail --silent --show-error \
                    --retry 8 \
                    --retry-all-errors \
                    --retry-delay 5 \
                    --max-time 20 \
                    --header "Authorization: Bearer ${STRAPI_API_TOKEN}" \
                    "$STRAPI_PING_URL"

            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              working-directory: .

            - name: Build Astro app
              run: pnpm build

            - name: Deploy to Cloudflare Production
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: apps/web
                  command: deploy --env production
