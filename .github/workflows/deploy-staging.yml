name: Deploy Staging to Cloudflare

on:
    push:
        branches:
            - staging
        paths:
            - "apps/web/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - ".github/workflows/deploy-staging.yml"

    workflow_dispatch:

concurrency:
    group: deploy-staging
    cancel-in-progress: true

jobs:
    deploy-staging:
        name: Deploy Staging
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: staging
        env:
            CLOUDFLARE_ENV: staging
            STRAPI_CMS_OPTIONAL: false
            PUBLIC_SENTRY_ENABLED: true
            PUBLIC_ENVIRONMENT: staging
            PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
            PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG: ${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
            PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}
            PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
            STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
            STRAPI_API_URL: ${{ vars.STRAPI_API_URL }}

        defaults:
            run:
                working-directory: apps/web

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              working-directory: .

            - name: Build Astro app
              run: pnpm build

            - name: Deploy to Cloudflare Staging
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: apps/web
                  command: deploy --env staging
