name: Frontend Integration (CI)

on:
    pull_request:
        branches:
            - main

jobs:
    integration:
        name: Frontend + Strapi
        runs-on: ubuntu-latest
        env:
            STRAPI_CMS_OPTIONAL: "true"
            APP_KEYS: key1,key2,key3,key4
            ADMIN_JWT_SECRET: ci-admin-jwt-secret
            API_TOKEN_SALT: ci-api-token-salt
            TRANSFER_TOKEN_SALT: ci-transfer-token-salt
            JWT_SECRET: ci-jwt-secret
            ENCRYPTION_KEY: ci-encryption-key

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Frontend lint
              run: pnpm --filter web lint

            - name: Frontend typecheck
              run: pnpm --filter web typecheck

            - name: Frontend format
              run: pnpm --filter web formatcheck

            - name: Frontend build
              run: pnpm --filter web build

            - name: Strapi build
              run: pnpm --filter headless-cms build
