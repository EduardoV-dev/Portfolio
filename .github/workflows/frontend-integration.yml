name: Frontend Integration (CI)

on:
    pull_request:
        branches:
            - main

jobs:
    integration:
        name: Frontend
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Frontend lint
              run: pnpm lint

            - name: Frontend typecheck
              run: pnpm typecheck

            - name: Frontend format
              run: pnpm formatcheck

            - name: Frontend build
              env:
                  STRAPI_CMS_OPTIONAL: "true"
              run: pnpm build
