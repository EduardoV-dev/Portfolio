name: Sync CMS Branch

on:
    push:
        branches:
            - main
        paths:
            - "apps/headless-cms/**"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "package.json"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: sync-cms-production-branch
    cancel-in-progress: true

jobs:
    sync:
        name: Sync main -> cms-production
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Push commit to cms-production
              run: git push origin HEAD:refs/heads/cms-production
