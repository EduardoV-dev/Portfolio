version: 1
applications:
    - appRoot: apps/web
      frontend:
          phases:
              preBuild:
                  commands:
                      - npm i -g pnpm
                      - pnpm config set store-dir .pnpm-store
                      - pnpm i --frozen-lockfile
              build:
                  commands:
                      - pnpm run build
          artifacts:
              baseDirectory: .amplify-hosting
              files:
                  - "**/*"
          cache:
              paths:
                  - .pnpm-store/**/*
